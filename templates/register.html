{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Account &bull; RJ GYM{% endblock %}

{% block content %}
<main class="py-5">
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8 col-sm-10">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <span class="brand-badge mb-2"><i class="bi bi-person-plus-fill"></i></span>
              <h2 class="fw-bold mb-1">Join RJ GYM</h2>
              <p class="text-secondary small">Create your member profile to unlock plans & coaching</p>
            </div>

            <form method="post" action="{% url 'register' %}">
              {% csrf_token %}
              {{ form|crispy }}

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-accent btn-lg fw-bold py-2">
                  <i class="bi bi-check2-circle me-1"></i> Create Member Account
                </button>
              </div>

              <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-secondary mb-0">
                  Already have an account? <a href="{% url 'login' %}" class="fw-bold text-decoration-none text-primary">Sign in here</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
