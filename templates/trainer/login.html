{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Trainer Portal Login &bull; RJ GYM{% endblock %}

{% block content %}
<main class="py-5">
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-10">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <span class="brand-badge mb-2" style="background: linear-gradient(135deg, #0f172a, #334155); color: #f59e0b;"><i class="bi bi-person-workspace"></i></span>
              <h2 class="fw-bold mb-1">Trainer Portal</h2>
              <p class="text-secondary small">Staff login for coaching, subscriber rosters & payments</p>
            </div>

            <form method="post" action="{% url 'trainer_login' %}">
              {% csrf_token %}
              {{ form|crispy }}

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-bold py-2">
                  <i class="bi bi-shield-lock-fill me-1"></i> Access Trainer Portal
                </button>
              </div>

              <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-secondary mb-0">
                  Are you a gym member? <a href="{% url 'login' %}" class="fw-bold text-decoration-none text-primary">Member Login</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
